<div class="card h-100">
    <div class="card-body d-flex justify-content-between align-items-center">
        <div>
            <h6 class="text-muted mb-1">{{ title }}{% if title_en %} ({{ title_en }}){% endif %}</h6>
            <h2 class="mb-0">{{ value }}</h2>
        </div>
        <i class="fa-solid {{ icon }} fa-2x text-{{ color|default:'primary' }}"></i>
    </div>
</div>
