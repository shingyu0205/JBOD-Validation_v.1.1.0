{% load i18n platform_i18n %}
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm border-bottom">

    <div class="container-fluid">

        <!-- 左邊 -->
        <div>

            <h4 class="mb-0 fw-bold">
                JBOD Validation Platform
            </h4>

            <small class="text-muted d-block">
                {% pt "企業級驗證管理系統" %}
            </small>

            <small class="text-primary fw-semibold">
                Version v1.2.2
            </small>

        </div>

        <!-- 右邊 -->
        <div class="d-flex align-items-center">

            <form action="{% url 'set_language' %}" method="post" class="me-3">
                {% csrf_token %}
                <input name="next" type="hidden" value="{{ request.get_full_path }}">
                <select name="language" class="form-select form-select-sm" aria-label="Language" onchange="this.form.submit()">
                    {% get_current_language as CURRENT_LANGUAGE %}
                    {% get_available_languages as LANGUAGES %}
                    {% for code, name in LANGUAGES %}
                        <option value="{{ code }}" {% if code == CURRENT_LANGUAGE %}selected{% endif %}>{{ name }}</option>
                    {% endfor %}
                </select>
            </form>

            <!-- Notification -->
            <button class="btn btn-light position-relative me-3">

                <i class="fa-solid fa-bell"></i>

                <span
                    class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">

                    0

                </span>

            </button>

            <!-- User -->
            <div class="dropdown">

                <button
                    class="btn btn-light dropdown-toggle"
                    data-bs-toggle="dropdown">

                    <i class="fa-solid fa-user me-2"></i>

                    {{ request.user.username }}

                </button>

                <ul class="dropdown-menu dropdown-menu-end">

                    <li>
                        <a class="dropdown-item" href="/admin/">
                            <i class="fa-solid fa-user-gear me-2"></i>
                            {% pt "Django 管理後台" %}
                        </a>
                    </li>

                    <li>
                        <hr class="dropdown-divider">
                    </li>

                    <li>

                        <form method="post"
                              action="{% url 'logout' %}"
                              class="m-0">

                            {% csrf_token %}

                            <button
                                type="submit"
                                class="dropdown-item text-danger">

                                <i class="fa-solid fa-right-from-bracket me-2"></i>

                                {% pt "登出" %}

                            </button>

                        </form>

                    </li>

                </ul>

            </div>

        </div>

    </div>

</nav>
