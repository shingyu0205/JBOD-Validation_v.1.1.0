<div class="card shadow-sm">

    <div class="card-body d-flex justify-content-end gap-2">

        <!-- ============================================= -->
        <!-- Start / Retry -->
        <!-- ============================================= -->

        {% if can_start %}

            <form
                method="post"
                action="{% url 'executor:start' job.pk %}"
            >

                {% csrf_token %}

                <button
                    type="submit"
                    class="btn btn-success"
                >

                    <i class="fa-solid fa-play me-1"></i>

                    {% if job.status == "PENDING" %}

                        Start

                    {% else %}

                        Retry

                    {% endif %}

                </button>

            </form>

        {% endif %}


        <!-- ============================================= -->
        <!-- Stop -->
        <!-- ============================================= -->

        {% if can_stop %}

            <form
                method="post"
                action="{% url 'executor:stop' job.pk %}"
            >

                {% csrf_token %}

                <button
                    type="submit"
                    class="btn btn-warning"
                >

                    <i class="fa-solid fa-stop me-1"></i>

                    Stop

                </button>

            </form>

        {% endif %}


        <!-- ============================================= -->
        <!-- Delete -->
        <!-- ============================================= -->

        {% if job.status != "RUNNING" %}

            <form
                method="post"
                action="{% url 'executor:delete' job.pk %}"
                onsubmit="return confirm('確定要刪除 Job #{{ job.pk }} 嗎？');"
            >

                {% csrf_token %}

                <button
                    type="submit"
                    class="btn btn-outline-danger"
                >

                    <i class="fa-solid fa-trash me-1"></i>

                    Delete

                </button>

            </form>

        {% endif %}


        <!-- ============================================= -->
        <!-- Back -->
        <!-- ============================================= -->

        <a
            href="{% url 'executor:index' %}"
            class="btn btn-secondary"
        >

            <i class="fa-solid fa-arrow-left me-1"></i>

            Back

        </a>

    </div>

</div>
