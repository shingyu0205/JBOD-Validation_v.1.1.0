<div class="card shadow-sm">

    <div class="card-header">

        <strong>

            <i class="fa-solid fa-clipboard-list me-2"></i>

            Test Plan Information

        </strong>

    </div>


    <div class="card-body">

        <div class="row">

            <!-- ========================================= -->
            <!-- Test Plan -->
            <!-- ========================================= -->

            <div class="col-md-4 mb-3">

                <div class="text-muted small">

                    Test Plan

                </div>

                <div class="fw-bold">

                    {{ job.testplan }}

                </div>

            </div>


            <!-- ========================================= -->
            <!-- Model -->
            <!-- ========================================= -->

            <div class="col-md-4 mb-3">

                <div class="text-muted small">

                    JBOD Model

                </div>

                <div class="fw-semibold">

                    {{ job.testplan.model|default:"-" }}

                </div>

            </div>


            <!-- ========================================= -->
            <!-- Firmware -->
            <!-- ========================================= -->

            <div class="col-md-4 mb-3">

                <div class="text-muted small">

                    Firmware

                </div>

                <div class="fw-semibold">

                    {{ job.testplan.firmware|default:"-" }}

                </div>

            </div>

        </div>


        <hr>


        <div class="row">

            <div class="col-md-3">

                <div class="text-muted small">

                    Total Test Cases

                </div>

                <div class="fs-5 fw-bold">

                    {{ total_testcases }}

                </div>

            </div>


            <div class="col-md-3">

                <div class="text-muted small">

                    PASS

                </div>

                <div class="fs-5 fw-bold text-success">

                    {{ pass_testcases }}

                </div>

            </div>


            <div class="col-md-3">

                <div class="text-muted small">

                    FAIL

                </div>

                <div class="fs-5 fw-bold text-danger">

                    {{ fail_testcases }}

                </div>

            </div>


            <div class="col-md-3">

                <div class="text-muted small">

                    Remaining

                </div>

                <div class="fs-5 fw-bold">

                    {{ remaining_testcases }}

                </div>

            </div>

        </div>

    </div>

</div>
